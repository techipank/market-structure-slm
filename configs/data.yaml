# Data pipeline configuration.
# Thresholds here are recorded into every validation report so old reports
# remain interpretable.

paths:
  raw_dir: data/raw
  report_dir: data/reports

defaults:
  interval: 1d
  start: "2015-01-01"
  # null = up to today. The most recent year is reserved as the holdout test
  # split, so the series must run to the present.
  end: null

thresholds:
  # Minimum |open - prev_close| / prev_close before a gap is even considered.
  min_gap_pct: 0.02
  # Robust z-score multiplier: cutoff = median + k * 1.4826 * MAD
  gap_mad_multiplier: 8.0
  # Single-bar (high - low) / close above this is flagged.
  max_bar_range_pct: 0.25
  # Consecutive zero-volume bars above this count are flagged.
  max_zero_volume_run: 5
  # Daily+ gaps up to this many business days are treated as exchange holidays
  # (INFO). Longer gaps are unexplained holes (WARNING). NSE observes far more
  # holidays than US equity markets and several are clustered, so this is
  # calibrated against NSE data rather than carried over from the US default.
  # See docs/data_sources.md.
  max_holiday_business_days: 4

# NSE (India) universe. Chosen empirically, not by reputation: two years of
# daily bars were screened for median turnover ("most active") and median ATR%
# ("most volatile"), then filtered for sector spread. Screen and findings are
# written up in docs/data_sources.md.
#
# Median ATR% is the volatility measure rather than standard deviation of
# returns, because two otherwise-qualifying candidates (VEDL, TRENT) carry
# unadjusted corporate actions that inflate a stdev figure by 3-16x while
# leaving the robust measure untouched.
symbols:
  # Consumer tech. Highest combined activity+volatility score in the screen
  # (ATR 3.40%, turnover ~Rs.979cr). Listed 2021-07, so ~5y of history.
  - symbol: ETERNAL.NS

  # IT services. Second-highest turnover of any Nifty 50 name (~Rs.1141cr)
  # while still volatile (ATR 2.23%) - the liquid anchor of the set.
  - symbol: INFY.NS

  # Automotive. ATR 2.51%, turnover ~Rs.765cr.
  - symbol: M&M.NS

  # Private bank. Included for regime diversity as much as volatility: the
  # 2025 accounting disclosure produced a sustained downtrend and a
  # high-volatility regime, which the evaluation categories need examples of.
  - symbol: INDUSINDBK.NS

  # Metals. A commodity-driven cycle that trends and ranges on a different
  # rhythm from the consumption and financial names above.
  - symbol: HINDALCO.NS

  # Infrastructure conglomerate. ATR 2.84%; repeated event-driven extremes
  # supply the EXTREME volatility stratum.
  #
  # History starts after the 2015-06 demerger (Ports, Power and Transmission
  # were spun out) rather than at the global 2015-01-01. yfinance does not
  # adjust for it, leaving a 220% discontinuity: 97.64 -> 312.39 on
  # 2015-06-03. The bar itself sits inside the indicator warm-up and would
  # never be sampled, but an EMA-200 spanning it blends two different
  # companies for roughly two hundred bars afterwards. Starting clean costs
  # five months of history and removes the problem entirely.
  - symbol: ADANIENT.NS
    start: "2015-07-01"

  # --- second tranche -------------------------------------------------
  # Added to widen the pool once the candle window moved to 100 bars. At that
  # window, non-overlapping prompts need 100 bars of separation, and six
  # symbols could only supply 106 examples with some strata down to a single
  # case. Four more sectors restores the count without compromising either
  # the window or the separation rule.

  # NBFC. ATR 2.94%, turnover ~Rs.424cr - the highest robust volatility of any
  # candidate that was not disqualified for a corporate action.
  - symbol: SHRIRAMFIN.NS

  # Healthcare. ATR 2.87%; a sector whose drivers are unrelated to the
  # financial and industrial names above.
  - symbol: MAXHEALTH.NS

  # Real estate. Rate-sensitive and strongly cyclical, so it contributes
  # sustained trends in both directions.
  - symbol: DLF.NS

  # Lending. Turnover ~Rs.712cr, ATR 2.39% - a large, liquid counterweight to
  # the smaller high-volatility names.
  - symbol: BAJFINANCE.NS


  # --- third tranche: universe expansion for dataset generation ---------
  # The corpus is bounded by bars, not by ambition. Ten symbols supply 23,706
  # pre-2025 bars, and the separation rule - no two examples may share a
  # candle, so 100 bars apart at a 100-bar window - caps that at ~237
  # examples. Relaxing separation would buy count without buying information,
  # because overlapping windows are near-duplicates. Widening the universe is
  # the only lever that adds independent examples.
  #
  # Chosen by `msdata screen` (report: data/reports/screen.csv), not by hand:
  # 186 candidates measured over two years, then filtered to those clear of
  # the corporate-action detector, above a Rs.100cr median turnover floor,
  # ranked on log(turnover) x median ATR%, and capped at three per sector so
  # the set cannot collapse into one correlated bloc. Numbers below are that
  # screen's, and are reproducible by re-running it.

