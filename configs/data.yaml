  # --- hourly tranche ---------------------------------------------------
  # Daily bars across 51 symbols cap the corpus at 715 examples. Hourly bars
  # on the most liquid names add roughly four hundred more, and add them in a
  # form that is not simply more of the same: intraday structure has its own
  # rhythm, and the higher-timeframe code path is exercised against real data
  # rather than one file.
  #
  # Ranked on turnover alone rather than the blended activity+volatility
  # score used for the daily set. Volatility is not the scarce quality at
  # this resolution; liquidity is, because a thin name's hourly bars are
  # mostly gaps and noise.
  #
  # yfinance caps hourly history at ~730 days regardless of exchange, so each
  # of these contributes roughly 2,100 pre-cutoff bars, not a decade.
