# Candidate pool for `msdata screen`. Not the instrument universe - that is
# `symbols:` in data.yaml, and it is chosen from the screen's output.
#
# Roughly the Nifty 200 by sector. Membership drifts and tickers get renamed
# (Zomato -> ETERNAL), so anything that fails to download is reported and
# skipped rather than treated as an error: a stale entry here should cost a
# line of output, not a run.
#
# Sector labels are for spread, not analysis. The screen ranks on measured
# activity and volatility; sectors only stop the selection collapsing into ten
# banks that all move together.

